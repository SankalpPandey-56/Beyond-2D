<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORM Studio · Maple Residence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
:root{--bg:#18202B;--panel:#1E2833;--line:#2D3947;--text:#E9E4DA;--mute:#8D98A6;--accent:#AE906C;--accent-ink:#18202B;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:14px/1.5 Manrope,system-ui,sans-serif;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:56px 1fr}
nav{display:flex;align-items:center;gap:28px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{font:600 24px 'Cormorant Garamond',Georgia,serif;letter-spacing:.04em}
.proj{color:var(--mute)}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{background:none;border:0;color:var(--mute);font:inherit;padding:8px 14px;border-radius:8px;cursor:pointer}
.tabs button.on{color:var(--text);background:var(--panel)}
.cta{margin-left:auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 18px;font:600 14px Manrope,sans-serif;cursor:pointer}
.cta:hover{filter:brightness(1.08)}
main{display:grid;grid-template-columns:250px 1fr 270px;min-height:0}
aside{background:var(--panel);padding:20px 16px;overflow:auto}
aside.l{border-right:1px solid var(--line)}aside.r{border-left:1px solid var(--line)}
h2{font:600 22px 'Cormorant Garamond',Georgia,serif;margin:0 0 14px}
.room{display:flex;justify-content:space-between;width:100%;background:none;border:1px solid transparent;color:var(--text);font:inherit;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px}
.room span:last-child{color:var(--mute)}
.room{transition:background .25s,border-color .25s,transform .25s cubic-bezier(.2,.8,.2,1)}
.modes button{transition:background .25s,color .25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#info>*{animation:in .4s cubic-bezier(.2,.8,.2,1) both}
.room.hov{background:#26323F;border-color:var(--line);transform:translateX(4px)}
.room.sel{border-color:var(--accent);background:rgba(174,144,108,.14)}
.total{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);display:flex;justify-content:space-between}
#stage{position:relative;min-width:0;min-height:0;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
.modes{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(30,40,51,.88);border:1px solid var(--line);border-radius:12px;padding:4px;backdrop-filter:blur(8px)}
.modes button{background:none;border:0;color:var(--mute);font:500 14px Manrope,sans-serif;padding:9px 18px;border-radius:9px;cursor:pointer}
.modes button.on{background:var(--accent);color:var(--accent-ink)}
.hint{position:absolute;left:18px;top:14px;color:var(--mute);font-size:13px;pointer-events:none}
#lab{position:absolute;left:0;top:0;pointer-events:none;background:var(--accent);color:var(--accent-ink);font:600 13px Manrope,sans-serif;padding:7px 14px;border-radius:999px;opacity:0;transition:opacity .35s;will-change:transform;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#tip{position:absolute;left:0;top:0;will-change:transform;pointer-events:none;background:rgba(24,32,43,.94);border:1px solid var(--accent);border-radius:8px;padding:6px 11px;font-size:13px;opacity:0;transition:opacity .15s;white-space:nowrap}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--mute)}
.sw{display:flex;gap:8px;margin:14px 0}
.sw i{width:28px;height:28px;border-radius:50%;border:1px solid var(--line)}
p.note{color:var(--mute);margin:16px 0 0}
@media(max-width:900px){main{grid-template-columns:1fr}aside{display:none}.tabs{display:none}nav{gap:12px}}
@media(prefers-reduced-motion:reduce){#tip{transition:none}#info>*{animation:none}.room{transition:none}}
</style>
</head>
<body>
<div class="app">
<nav><span class="logo">FORM Studio</span><span class="proj">Maple Residence</span>
<div class="tabs"><button>Floor plan</button><button class="on">3D model</button><button>Materials</button></div>
<button class="cta">Export model</button></nav>

<aside class="l"><h2>Rooms</h2><div id="list"></div><div class="total"><span>Total interior</span><span id="tot"></span></div></aside>

<div class="modes" id="modes"><button data-m="plain">3D view</button><button data-m="day" class="on">Daylight</button><button data-m="night">Nightlight</button></div></div>
<aside class="r" id="info"></aside>
</main></div>
